version: '3.8'

services:
  etl-auction-batch-process:
    image: etl-auction-batch-process:0.0.1-SNAPSHOT
    container_name: etl-auction-batch-process
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://172.17.0.1:5432/auction_db
      - SPRING_DATASOURCE_USERNAME=auction_app
      - SPRING_DATASOURCE_PASSWORD=auction123

  product-services:
    image: product-services:0.0.1-SNAPSHOT
    container_name: product-services
    restart: unless-stopped
    ports:
      - "8082:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://172.17.0.1:5432/auction_db
      - SPRING_DATASOURCE_USERNAME=auction_app
      - SPRING_DATASOURCE_PASSWORD=auction123
